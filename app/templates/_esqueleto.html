<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F9FAFB">
  <title>{% block titulo %}{% endblock %} · ControlGastos</title>
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-5.3.3/css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons-1.11.3/bootstrap-icons.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/inter-5.2.8/inter.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="{% block clase_cuerpo %}{% endblock %}">
  <a class="visually-hidden-focusable cg-saltar" href="#contenido">Saltar al contenido</a>
  {% block cuerpo %}{% endblock %}
  {% include "componentes/toasts.html" %}
  <script src="{{ url_for('static', filename='vendor/bootstrap-5.3.3/js/bootstrap.bundle.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
