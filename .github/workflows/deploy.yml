name: Despliegue

# Despliegue manual en el VPS (EDT 5.3): Actions → Despliegue → Run workflow.
#
# Está desactivado hasta la EDT 5.3: solo se ejecuta si la variable del repositorio
# DESPLIEGUE_HABILITADO vale "si" (Settings → Secrets and variables → Actions → Variables).
# Necesita los secretos VPS_HOST, VPS_USER y VPS_SSH_KEY; cómo crearlos está en
# docs/DESPLIEGUE_HOSTINGER.md, sección "Despliegues siguientes".

on:
  workflow_dispatch:

concurrency:
  group: despliegue
  cancel-in-progress: false

jobs:
  desplegar:
    name: Desplegar la rama main en el VPS
    if: vars.DESPLIEGUE_HABILITADO == 'si'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Preparar la llave SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Ejecutar desplegar.sh en el servidor
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" "sudo bash /srv/controlgastos/deploy/scripts/desplegar.sh"
