# Nginx para ControlGastos (EDT 5.3). Es una plantilla: cambia DOMINIO por tu dominio.
#
#   sudo sed "s/DOMINIO/midominio.com/g" /srv/controlgastos/deploy/nginx/controlgastos.conf \
#     | sudo tee /etc/nginx/sites-available/controlgastos > /dev/null
#   sudo ln -sf /etc/nginx/sites-available/controlgastos /etc/nginx/sites-enabled/controlgastos
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Después, Certbot agrega el bloque HTTPS (443) y la redirección 301 desde HTTP:
#   sudo certbot --nginx -d DOMINIO -d www.DOMINIO --redirect

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO www.DOMINIO;

    # No mostrar la versión de Nginx en las respuestas ni en las páginas de error
    server_tokens off;

    # Los formularios de la aplicación son pequeños y no se suben archivos
    client_max_body_size 1m;

    # Compresión de las respuestas de texto
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Archivos estáticos servidos directamente por Nginx, con caché de 7 días.
    # Las páginas de la aplicación ya traen sus cabeceras de seguridad (Flask-Talisman);
    # estas cubren los archivos que no pasan por ella.
    location /static/ {
        alias /srv/controlgastos/app/static/;
        expires 7d;
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Todo lo demás va a Gunicorn por el socket Unix
    location / {
        proxy_pass http://unix:/run/controlgastos/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 30s;
    }
}
