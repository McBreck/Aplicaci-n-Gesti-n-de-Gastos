# Verificación de estilo PEP 8 (RNF-15). Desde la raíz del repositorio:
#   python -m flake8
# Por acuerdo del proyecto, las líneas pueden tener hasta 120 caracteres; el resto de PEP 8 se aplica sin cambios.

[flake8]
max-line-length = 120
exclude = .git,.venv,__pycache__

[pycodestyle]
max-line-length = 120
exclude = .git,.venv,__pycache__
